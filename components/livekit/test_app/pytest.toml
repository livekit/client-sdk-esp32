[pytest]
python_files = ["pytest_*.py"]
addopts = [
    "--embedded-services", "esp,idf",
    "--root-logdir", "logs",
    "--junitxml", "logs/junit.xml"
]
junit_family = "xunit1"
norecursedirs = ["managed_components", "build"]
filterwarnings = [
    "ignore::pytest.PytestExperimentalApiWarning",
    "ignore::jwt.warnings.InsecureKeyLengthWarning"
]
