dependencies:
  idf: ">=5.4"
  livekit/livekit:
    version: "0.3.11"
    override_path: ../../../
  livekit/sandbox_token:
    version: ~0.1.0
    override_path: ../../../../sandbox_token
  livekit/example_utils:
    version: ~0.2.0
    override_path: ../../../../example_utils
  livekit/s31_board:
    version: ~0.1.0
    override_path: ../../../../s31_board
    rules: [{if: "target in [esp32s31]"}]
  tempotian/codec_board:
    version: ^2.0.2
    rules: [{if: "target not in [esp32s31]"}]
  espressif/esp32_s3_korvo_2:
    version: "4.1.2"
    rules: [{if: "target in [esp32s3]"}]
