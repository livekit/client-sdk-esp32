[project]
name = "esp-example-agent"
version = "0.1.0"
description = "Example agent for ESP32 voice agent example."
license = {text = "MIT"}
requires-python = ">=3.10, <3.15"
dependencies = [
    "livekit-agents~=1.8",
    "livekit-plugins-noise-cancellation~=0.3",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
