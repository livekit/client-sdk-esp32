dependencies:
  idf: ">=5.4"
  livekit/livekit:
    version: "0.3.11"
    override_path: ../../../
  livekit/sandbox_token:
    version: ~0.1.0
    override_path: ../../../../sandbox_token
  livekit/example_utils:
    version: ~0.2.0
    override_path: ../../../../example_utils
  tempotian/codec_board: ~2.0.2
  # The following components are required to connect to WiFi for ESP32-P4-based
  # development board that supports WiFi (e.g. ESP32-P4-Function-EV-Board). The
  # co-processor firmware may need to be updated to match the esp_hosted version.
  espressif/esp_hosted:
    version: ~2.12.13
    rules: [{if: "target in [esp32p4]"}]
  espressif/esp_wifi_remote:
    version: ~1.6.4
    rules: [{if: "target in [esp32p4]"}]
