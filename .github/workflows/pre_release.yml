# On demand: open an rc PR from the branch the workflow is run on, for every
# package with a pending changeset. Merging it tags e.g. 0.4.0-rc.1.
# Changesets stay pending for the final release.
name: Pre-release PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags number the rc
      - uses: livekit/verwalter@3c80f3f938fe9da6fa3a6d919f3c1e5cacef4600 # v0.29.0
        with:
          command: pre-release
          args: --target ${{ github.ref_name }}
          app-client-id: ${{ secrets.VERWALTER_RELEASE_CLIENT_ID }}
          app-private-key: ${{ secrets.VERWALTER_RELEASE_APP_KEY }}
